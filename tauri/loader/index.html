  The minimal build bundles this page instead of the engine. On a cold cache it
  shows while the signed updater fetches the engine into the host cache; the shell
  then reloads the window so the cached engine's index.html replaces it. It polls
  the `module_status` command so a failed fetch surfaces instead of spinning forever.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenTS</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #101014; color: #e6e6e6;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .wrap { text-align: center; max-width: 34rem; padding: 2rem; }
    .spinner {
      width: 48px; height: 48px; margin: 0 auto 1.5rem;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6ea8fe; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { white-space: pre-line; }
    .status.error { color: #ff8a8a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Preparing the engine&hellip;</div>
  </div>
  <script>
    (function () {
      var statusEl = document.getElementById("status");
      var spinnerEl = document.getElementById("spinner");

      function core() {
        var c = window.__TAURI__ && window.__TAURI__.core;
        return c && typeof c.invoke === "function" ? c : null;
      }

      // Turns an updater error string into a line a player can act on. The raw detail is
      // kept in parentheses for a bug report; the lead says which of the three things went
      // wrong: the server has no engine to fetch, it has one this build cannot use, or it
      // could not be reached at all.
      function explain(detail) {
        var d = detail.toLowerCase();
        if (/http (4|5)\d\d|not found|no assets\.json|no engine\.json/.test(d)) {
          return "The installation server does not have an engine this version of OpenTS can " +
            "use. It may be offline or not yet updated.";
        }
        if (/signature|descriptor|requirement|rollback|sha256|hash|manifest|format/.test(d)) {
          return "The installation server offered an engine this version of OpenTS cannot use. " +
            "The server and this build are out of step.";
        }
        if (/no engine bundled|no local data|no update key/.test(d)) {
          return "This build cannot fetch an engine: it ships without one and has no update key.";
        }
        return "OpenTS could not reach the installation server.";
      }

      function showError(detail) {
        detail = String(detail || "").trim();
        spinnerEl.style.display = "none";
        statusEl.className = "status error";
        statusEl.textContent = explain(detail) +
          "\n\nCheck your connection, then restart OpenTS." +
          (detail ? "\n\n(" + detail + ")" : "");
        try { console.error("[loader] engine unavailable: " + detail); } catch (e) {}
      }

      // The shell reloads the window onto the cached engine once it is installed. That is
      // the only thing that ends the "ready" wait, so a swap that never happens would spin
      // this page forever; after a grace period it is surfaced rather than left silent.
      var readySince = 0;

      function poll() {
        var c = core();
        if (!c) { setTimeout(poll, 200); return; }
        c.invoke("module_status").then(function (raw) {
          var state = String(raw || "");
          if (state.indexOf("error:") === 0) {
            showError(state.slice("error:".length));
          } else if (state === "ready") {
            statusEl.textContent = "Starting OpenTS…";
            if (!readySince) readySince = Date.now();
            if (Date.now() - readySince > 8000) {
              showError("the engine reported ready but the window did not start it");
            } else {
              setTimeout(poll, 500);
            }
          } else {
            readySince = 0;
            statusEl.textContent = "Downloading the engine…";
            setTimeout(poll, 500);
          }
        }).catch(function () { setTimeout(poll, 500); });
      }

      poll();
    })();
  </script>
</body>
</html>
