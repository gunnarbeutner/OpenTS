<body>

<canvas id="canvas" tabindex="0"></canvas>
<div id="speed"></div>
<div id="loading">
	<div>
		<div class="label">LOADING</div>
		<div class="track"><div class="fill" id="loading-fill"></div></div>
		<div class="note" id="loading-note">starting&hellip;</div>
	</div>
</div>
<div id="unsupported" hidden>
	<div>
		<p class="eyebrow">OPENTS</p>
		<h1>The game did not load.</h1>
		<!-- Written by the loader, which is the only thing that knows which of the two
		     modules was wanted and why it was not there. -->
		<p id="reason"></p>
		<p class="quiet" id="note"></p>
	</div>
</div>
<div id="panel">
	<div id="toggle" title="Show or hide the diagnostic log">log</div>
	<div id="grab" title="Take the mouse so the log can be selected and copied">select</div>
	<h1>OPENTS &mdash; WEBASSEMBLY</h1>
	<div id="status">loading&hellip;</div>
	<pre id="log"></pre>
</div>
<button id="sound" type="button" hidden><span id="sound-label">Click for sound</span></button>

<div id="groups" hidden></div>

<div id="downloads" hidden>
	<div id="downloads-list" hidden>
		<button type="button" class="close" id="downloads-close" title="Dismiss">&times;</button>
		<h2 id="downloads-heading" hidden>Desktop app</h2>
		<div id="downloads-builds"></div>
		<button type="button" id="downloads-more" hidden>Other platforms</button>
		<div id="downloads-others" hidden></div>
		<p class="notice">Unofficial third-party distribution of OpenTS (opents.net), not
		affiliated with the OpenTS project.</p>
		<div id="offline" hidden>
			<h2>Play offline</h2>
			<button type="button" id="offline-start">Keep the game on this device</button>
			<p class="offline-note" id="offline-note"></p>
		</div>
	</div>
	<button type="button" id="downloads-open" title="Keep this game">
		<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false">
			<rect x="1.6" y="2.6" width="12.8" height="8.8" rx="1.4" fill="none"
				stroke="currentColor" stroke-width="1.4"/>
			<path d="M6 14h4" fill="none" stroke="currentColor" stroke-width="1.4"
				stroke-linecap="round"/>
		</svg>
		<span id="downloads-label">Keep this game</span>
	</button>

<template id="downloads-arrow">
	<svg class="arrow" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
		<path d="M8 1.5v8M4.5 6.5 8 10l3.5-3.5M2 13h12" fill="none" stroke="currentColor"
			stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
	</svg>
</template>
</div>
