# A relay on Fly, one machine, asleep when nobody is playing. docs/RELAY.md describes what
# it carries; this file only says where it runs.

app = "opents-relay"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8766
  force_https = true

  # A room is held in memory and exists only while it has members, so a machine that stops
  # once the last client disconnects destroys nothing that was still there. Waking is well
  # inside the ten seconds RelayInterfaceClass::Open_Socket waits, and the proxy holds the
  # connection while it happens rather than refusing it.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # Autostop counts connections, and a WebSocket is held open for as long as its client is
  # in the lobby -- which is what keeps a machine up under an idle game rather than one
  # sending frames.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 260
    soft_limit = 240

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
